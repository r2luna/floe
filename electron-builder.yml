appId: me.lunardelli.floe
productName: Floe
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/**/*
  - package.json
  # node-pty is a native dependency required at runtime (not bundled by Vite).
  - node_modules/node-pty/**/*
# The `floe` command's script. An extraResource, not a `files` entry: the shim
# in ~/.local/bin execs it with the app binary as node, and nothing can exec a
# path inside the asar.
extraResources:
  - from: bin
    to: bin
# Native .node binaries can't be loaded from inside the asar archive.
asarUnpack:
  - node_modules/node-pty/**/*
  # The headless daemon (build:server) is executed by launchd/systemd via
  # ELECTRON_RUN_AS_NODE — plain node can't read from inside the asar.
  - out/server/**/*
mac:
  icon: resources/icon.icns
  target:
    # dmg = first-install image. zip = the artifact Squirrel.Mac swaps in for
    # auto-updates; without it electron-updater has nothing to download.
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  # Unsigned: public builds come from CI with no Apple Developer ID. Squirrel.Mac
  # cannot apply an unsigned update, so on macOS the app announces a release and
  # links to it instead of installing it (see src/main/autoUpdate.ts).
  identity: null
  # Hardened runtime is only needed for Apple notarization (Developer ID cert).
  # With a self-signed cert it blocks Keychain access, so safeStorage reports
  # "encryption unavailable" and Jira/Bitbucket tokens can't be saved.
  hardenedRuntime: false
dmg:
  title: Floe ${version}
linux:
  # Usa resources/icon.png (512px) automaticamente.
  # ponytail: AppImage é o formato portátil sem dependências de distro. Adicione deb/rpm se precisar de repos.
  target:
    - AppImage
  category: Development
# Releases live on GitHub Releases. The release workflow opens a draft for the
# tag, each platform uploads its installers plus latest-mac.yml or
# latest-linux.yml into it, and the last job publishes it.
publish:
  provider: github
  owner: r2luna
  repo: floe
  releaseType: draft
