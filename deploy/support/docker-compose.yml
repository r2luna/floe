# Rookery — shared "support" stack for the server machine (Beelink).
# One MySQL + one Postgres + one Redis + one DBGate serve ALL worktrees (one
# database + one key-prefix per worktree, set by provisioning), so N dev
# environments don't mean N DB/cache containers.
#
# Edge/TLS is NOT here: the host's own Caddy (Tailscale IP, cloudflare DNS-01)
# fronts everything and Rookery writes per-worktree routes into its Caddyfile
# (see src/main/caddy.ts). DBGate + worktree apps publish loopback ports for it.
#
# The per-worktree PHP/app container (serversideup images) is generated per
# worktree (src/main/compose.ts) — this file is only the shared infra.
#
# Bring it up with:  rookery server support up
name: rookery-support

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # Published on loopback for host-native fallback + manual admin. Container
    # apps reach it by service name (`mysql`) over the shared `rookery` network.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - rookery
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rookery
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  dbgate:
    image: dbgate/dbgate:latest
    restart: unless-stopped
    # Both shared DBs pre-wired, so DBGate opens already connected — no manual login.
    environment:
      CONNECTIONS: con1,con2
      LABEL_con1: MySQL
      SERVER_con1: mysql
      USER_con1: root
      PASSWORD_con1: ${MYSQL_ROOT_PASSWORD}
      PORT_con1: "3306"
      ENGINE_con1: mysql@dbgate-plugin-mysql
      LABEL_con2: Postgres
      SERVER_con2: postgres
      USER_con2: postgres
      PASSWORD_con2: ${POSTGRES_PASSWORD}
      PORT_con2: "5432"
      ENGINE_con2: postgres@dbgate-plugin-postgres
    volumes:
      - dbgate-data:/root/.dbgate
    # Published on loopback for the host Caddy to reverse-proxy `db.dev.${DOMAIN}`.
    ports:
      - "127.0.0.1:41800:3000"
    networks:
      - rookery

  # Shared Redis for cache/session/queue across ALL worktrees. Isolation is by a
  # per-worktree key prefix (REDIS_PREFIX, set in provisioning), not by DB index —
  # Redis' 16-DB ceiling doesn't scale to N worktrees. No password: same private
  # `rookery` network posture as the DBs.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Loopback for host-native fallback + manual admin; containers reach it as `redis`.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rookery
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

# Shared network the per-worktree app containers join (external: true in their own
# compose files). Named so `rookery-<slug>` projects can consume it by name.
networks:
  rookery:
    name: rookery

volumes:
  mysql-data:
  postgres-data:
  dbgate-data:
  redis-data:
