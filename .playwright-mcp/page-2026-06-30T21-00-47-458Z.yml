  - generic [ref=e245]:
    - generic [ref=e246]:
      - img [ref=e247]
      - text: How it actually started
    - heading "Uncompromised local LLM experience." [level=2] [ref=e250]
    - paragraph [ref=e251]: I started working on the Odysseus project because running local AI felt fun and powerful. But the options at the time to engage with LLMs felt like taking steps back. The idea that you could just self-host AI and not pay for a subscription wasn't there. All the tools and functions that make it all magic were missing.
    - paragraph [ref=e252]: "So I started building Odysseus bit by bit — and the more I gave it to work with, the better it served me. Turns out the more your model knows about you, the more useful it gets. Which is the other reason to self-host: you get all that context without handing your private data to someone else's cloud."
